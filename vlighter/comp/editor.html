<div class="editor_container">
    <div class="editor_body flex row swap">
		<div class="flex column">
			<details class="card" id="source" open>
				<summary><h2>Add a Source</h2></summary>
				<label>Paste Your VOD URL</label>
				<input type="text" id="url" placeholder="https://youtube.com/watch?v=…">
			</details>
			<details class="card" id="metadata" open>
				<summary><h2>View Metadata</h2></summary>
				<div id="info"></div>
			</details>
		</div>
		<div class="flex column" id="clip_container">
			<div class="card" id="clip">
				<h2 class="section-label">Clip A Highlight</h2>
				<div id="preview" class="flex column center">
					<span class="text muted" id="preview_text">Preview Will Appear Here</span>
				</div>
				<div class="controls">
					<div class="field">
						<label>Start Time</label>
						<input type="text" id="start" value="00:00:00">
					</div>
					<div class="field">
						<label>End Time</label>
						<input type="text" id="end" value="00:00:00">
					</div>
				</div>
			</div>
		</div>
	</div>
    <style>
		#clip{
			height: 80vh !important;
			width: 100% !important;
			max-width:none !important;
			margin: 0 !important;
		}
		#preview{
			overflow: hidden;
			width: 100% !important;
			height: 56vh !important;
			background-color: var(--background);
			&>*{
				width: 100% !important;
				object-fit: cover;
				margin: auto !important;
			}
		}
		#source{
			width: 30vw;
			min-height: fit-content;
		}
		#metadata{
			width: 30vw;
			height: 100%;
		}
		.controls{
			display: flex;
			flex-direction: row;
			justify-content: flex-start;
			align-items: center;
			gap: 2rem;
		}
		.editor_body{
			padding: 1rem;
			margin: auto auto;
			display: flex;
			flex-direction: row;
			justify-content: start;
			align-items: flex-start;
			gap: 1rem;
			height: fit-content;
			&>*{
				margin: 0 !important;
			}
		}
		#clip_container{
			width: 100% !important;
		}
		@media screen and (max-width: 1000px) {
			#source{
				width: 100% !important;
			}
			#metadata{
				display: none !important;
			}
			#clip{
				width: 100% !important;
				height: fit-content !important;
			}
			#preview{
				height: fit-content !important;
			}
		}
    </style>
    <script>
        (function(){
			async function get_metadata(url){
				// call to get metadata
				let res = await fetch('/get_metadata', {
					method: 'POST', // *GET, POST, PUT, DELETE, etc.
					headers: {
						'Content-Type': 'application/json'
						// 'Content-Type': 'application/x-www-form-urlencoded',
					},
					body: JSON.stringify({url: url}) // body data type must match "Content-Type" header
				}).then(response => response.json()).catch(error => alert('URL Invalid...', error))
				return res
			}
			function save_source_config(element){
				let data = {};
				let payload = {}
				data['url'] = element.querySelector('#url').value 
				// document.createElement('source').src = data['url']
				// document.querySelector('preview').appendChild(document.createElement('source'))
				// document.querySelector('preview').load()
				// document.querySelector('preview').hidden = false
				data['start'] = element.querySelector('#start').value
				data['end'] = element.querySelector('#end').value
				payload['download_video'] =  data
				// save to local storage
				localStorage.setItem('source', JSON.stringify(payload))
			}
			async function check_metadata(url, element){
				// call to get metadata
				let preview_text = element.querySelector('#preview_text')
				if (preview_text)
					preview_text.innerHTML = "Loading Preview..."
				let metadata = await get_metadata(url.value)
				console.log("metadata ", metadata)
				// check if valid
				if (metadata['thumbnail']) {
					save_source_config(element)
					setup_editor(metadata, element)
				}
				
			}
			
			function generate_time_string(seconds){
				let hours = Math.floor(seconds / 3600)
				let minutes = Math.floor((seconds - hours * 3600) / 60)
				let secs = seconds - hours * 3600 - minutes * 60
				return `${hours>9?hours:'0'+hours}:${minutes>9?minutes:'0'+minutes}:${secs>9?secs:'0'+secs}`
			}

			function get_seconds(time_string){
				let hours = parseInt(time_string.split(':')[0])
				let minutes = parseInt(time_string.split(':')[1])
				let seconds = parseInt(time_string.split(':')[2])
				return hours * 3600 + minutes * 60 + seconds
			}

			function setup_editor(metadata, element){
				// update preview
				element.querySelector('#preview').innerHTML = ""
				let img = document.createElement('img')
				img.src = metadata['thumbnail']
				// img.classList.add('block_image')
				element.querySelector('#preview').appendChild(img)

				// update info
				let info = document.querySelector('#info')
				info.innerHTML = ""
				// title, descriptiopn, duration
				let title_label = document.createElement('label')
				title_label.innerText = "Title"
				let title = document.createElement('input')
				title.type = "text"
				title.value = metadata['title']
				title.readOnly = true
				info.appendChild(title_label)
				info.appendChild(title)

				let description_label = document.createElement('label')
				description_label.innerText = "Description"
				let description = document.createElement('input')
				description.type = "text"
				description.value = metadata['description']
				description.readOnly = true
				info.appendChild(description_label)
				info.appendChild(description)

				let duration_label = document.createElement('label')
				duration_label.innerText = "Duration"
				let duration = document.createElement('input')
				duration.type = "text"
				duration.value = generate_time_string(metadata['duration'])
				duration.readOnly = true
				info.appendChild(duration_label)
				info.appendChild(duration)

				// update timeline
				element.querySelector('#start').value = "00:00:00"
				element.querySelector('#end').value = generate_time_string(metadata['duration'])
			}

            function init(data){
				element = document.getElementById(`${data.id}`)
				console.log("editor ", element)
				// load from local storage
				let payload = JSON.parse(localStorage.getItem('source'))
				if (payload) {
					console.log(payload)
					element.querySelector('#url').value = payload['download_video']['url']
					element.querySelector('#start').value = payload['download_video']['start']
					element.querySelector('#end').value = payload['download_video']['end']
				
				}
				console.log(payload)
				// get url
				url_el = element.querySelector('#url')
				if (url_el.value) {
					check_metadata(url_el, element)
				}
				// alert(url)
				url_el.onchange = async (url) => {
					check_metadata(url_el, element)

				}
				// get start time
				start = element.querySelector('#start')
				start.onchange = () => {
					save_source_config(element)
				}
				// get end time
				end = element.querySelector('#end')
				end.onchange = () => {
					save_source_config(element)
				}

            }

            window.componentRegistry.register("editor", init)
        })()
    </script>
</div>
