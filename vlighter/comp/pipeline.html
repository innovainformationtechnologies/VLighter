<div class="pipeline_container">
    <div class="card pipeline_body">
		<h2>Export Formats</h2>
		<div class="controls flex row spread">
			<label for="node_select">Select Format</label>
			<select class="btn-primary" id="node_select" name="node_select">
				<option value="make_clip">Clip</option>
				<option value="make_timelapse">Timelapse</option>
				<option value="make_podcast">Podcast</option>
				<option value="make_short">Shorts/Reels</option>
			</select>
			<button class="btn-primary" id="add_node">✔</button>
		</div>
		<div id="output_control">Select a format</div>
		<button class="btn-primary" id="runBtn"><div>▶ RUN PIPELINE</div></button>
		<p class="text accent center" id="status" hidden>Your folder will open when ready</p>
    </div>
    <style>
		
		.controls{
			display: flex;
			flex-direction: row;
			justify-content: flex-start;
			align-items: center;
			gap: 2rem;
		}
		.pipeline_body{
			padding: 1rem;
			width: 100%;
			margin: auto auto;
			display: flex;
			flex-direction: column;
			gap: 1rem;
		}
		#output_control{
			margin: auto auto;
			width: 100%;
			min-height: 5rem;
			height: fit-content;
			background-color: var(--background);
			border: 1px solid var(--border);
    		border-radius: var(--radius);
		}
		#node_select{
			width: fit;
		}
    </style>
    <script>
        (function(){
			let status = null
			let selected_format = null;
			async function build_pipeline_payload() {
				console.log("build_pipeline_payload ", selected_format)
				let source = JSON.parse(localStorage.getItem('source'));
				let source_type = Object.keys(source)[0];
				let format = JSON.parse(localStorage.getItem(selected_format));
				const payload = {}
				payload[source_type] =  source[source_type],
				payload[selected_format] = format[selected_format],
				
				console.log("payload ", payload)

				const res = await fetch('/run', {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify(payload),
				});

				if (!res.ok) {
				const err = await res.json();
				};
			}

			async function set_output(node){
				let loadComponent, componentRegistry
				await import("./scripts/util.js").then((module) => {
					loadComponent = module.loadComponent;
					componentRegistry = module.componentRegistry
				});
				let output_control = document.querySelector("#output_control")
				output_control.innerHTML = "";	
				await loadComponent(node, output_control)
				componentRegistry.get(node)({id: "output_control"})
				selected_format = node
				// let close_btn = document.createElement("button")
				// close_btn.classList.add("btn-primary")
				// close_btn.innerHTML = "<span class=\"text\">x</span>"
				// close_btn.onclick = () => {
				// 	nodes.splice(nodes.indexOf(node), 1)
				// 	close_btn.parentElement.remove()
				// }
			}

			async function get_status(element) {
				let s = await fetch("/status")
				status = await s.json()
				element.querySelector("#runBtn").disabled = !status.job_running
				if (status.job_running) {
					element.querySelector("#runBtn").innerHTML = " ⏲ RUNNING"
					element.querySelector("#runBtn").disabled = true
					element.querySelector("#status").hidden = false
				} else {
					element.querySelector("#runBtn").innerHTML = "▶ RUN PIPELINE"
					element.querySelector("#runBtn").disabled = false
					element.querySelector("#status").hidden = true
				}
			}
            function init(data){
                const element = document.getElementById(`${data.id}`)
				
				element.querySelector("#add_node").onclick = () => {
					const node = element.querySelector("#node_select").value
					console.log("adding node ", node)
					set_output(node)
				}
				element.querySelector("#runBtn").onclick = async () => {
					if (!selected_format) {
						alert("Please select a format")
						return
					}
					build_pipeline_payload()
					setInterval(() => {
						get_status(element)
					}, 10000)
					get_status(element)
				}
				get_status(element)
            }

            window.componentRegistry.register("pipeline", init)
        })()
    </script>
</div>
