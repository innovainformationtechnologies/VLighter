<div class="source_container">
    <div class="card source_body">
		<h2 class="section-label">Video Source</h2>
		<div class="field">
			<label for="online">Use Video From Web</label>
			<input type="checkbox" id="use_online_video" name="online" class="btn-primary" checked>
		</div>
		<div class="field online" id="online">
			<label>VOD URL</label>
			<input type="text" id="url" placeholder="https://youtube.com/watch?v=…">
		</div>
		<div class="field offline" id="offline">
			<label>Local File</label>
			<input type="file" id="path">
		</div>
		<video id="preview" hidden></video>
		<div class="controls">
			<div class="field">
				<label>Start Time</label>
				<input type="text" id="start" value="00:00:00">
			</div>
			<div class="field">
				<label>End Time</label>
				<input type="text" id="end" value="00:00:00">
			</div>
		</div>
	</div>
    <style>
		.basic_info{
			display: flex;
			flex-direction: row;
			justify-content: space-between;
			align-items: flex-start;
			padding: 1rem;
			&>div{
				flex: 1;
				margin: 0 1rem;
			}
		}
		.controls{
			display: flex;
			flex-direction: row;
			justify-content: flex-start;
			align-items: center;
			gap: 2rem;
		}
		.source_body{
			padding: 1rem;
			margin: auto auto;
			display: flex;
			flex-direction: column;
			gap: 1rem;
		}
        .block_image{
            width: 100%;
            height: auto;
            object-fit: cover;
            border-radius: 1rem;
        }
    </style>
    <script>
        (function(){

			function check_online(){
				const use_online_video = document.getElementById('use_online_video');
				const online = document.getElementById('online');
				const offline = document.getElementById('offline');
				if(use_online_video.checked){
					online.style.display = 'block';
					offline.style.display = 'none';
				}else{
					online.style.display = 'none';
					offline.style.display = 'block';
				}
			}
			function save_source_config(){
				let online = document.getElementById('use_online_video').checked
				let data = {};
				let payload = {}
				if (online){
					data['url'] = document.getElementById('url').value 
					// document.createElement('source').src = data['url']
					// document.getElementById('preview').appendChild(document.createElement('source'))
					// document.getElementById('preview').load()
					// document.getElementById('preview').hidden = false
				}else{
					data['path'] = document.getElementById('path').value
					// document.createElement('source').src = data['path']
					// document.getElementById('preview').appendChild(document.createElement('source'))
					// document.getElementById('preview').load()
					// document.getElementById('preview').hidden = false
				}
				data['start'] = document.getElementById('start').value
				data['end'] = document.getElementById('end').value
				if (online) {
					payload['download_video'] =  data
				}else{
					payload['import_video'] = data
				}
				// save to local storage
				localStorage.setItem('source', JSON.stringify(payload))
			}
            function init(data){
				// load from local storage
				let payload = JSON.parse(localStorage.getItem('source'))
				if (payload) {
					if (payload['download_video']){
						document.getElementById('use_online_video').checked = true
						document.getElementById('url').value = payload['download_video']['url']
						document.getElementById('start').value = payload['download_video']['start']
						document.getElementById('end').value = payload['download_video']['end']
					}else{
						document.getElementById('use_online_video').checked = false
						document.getElementById('path').value = payload['import_video']['path']
						document.getElementById('start').value = payload['import_video']['start']
						document.getElementById('end').value = payload['import_video']['end']
					}
				}
				// get online status
				online = document.getElementById('use_online_video')
				online.onchange = () => {
					check_online()
				}
				// get url
				url = document.getElementById('url')
				url.onchange = () => {
					save_source_config()
				}
				// get path
				path = document.getElementById('path')
				path.onchange = () => {
					save_source_config()
				}
				// get start time
				start = document.getElementById('start')
				start.onchange = () => {
					save_source_config()
				}
				// get end time
				end = document.getElementById('end')
				end.onchange = () => {
					save_source_config()
				}
				check_online()
            }

            window.componentRegistry.register("source", init)
        })()
    </script>
</div>
