<div class="tabs_container">
    <div class="tabs_body">
		<div class="controls flex row spread">
			<h1 class="title">VLighter Admin</h1>
		</div>
		<div id="view" class="card"></div>
    </div>
    <style>
		.logo{
			width: 4rem !important;
			object-fit: contain;
			margin: auto;
		}

		.tabs_body{
			padding: 1rem;
			width: 100vw;
			/* height: fit-content; */
			/* width: fit-content; */
			margin: auto auto;
			display: flex;
			flex-direction: column;
			background-color: none !important;
			&>.controls{
				display: flex;
				flex-direction: row;
				justify-content: flex-start;
				align-items: center;
				gap: 2rem;
				width: 100vw;
				&>*{
					width: 100%
				}
			}
		}
		.tabs_container{
			height: fit-content;
		}
		.tab{
			width: fit-content !important;
			padding: 1rem;
		}
		#view{
			margin: auto auto;
			width: 90vw;
			height: fit-content;
			/* border: 1px solid var(--border);
    		border-radius: var(--radius); */
			padding: 1rem;
			overflow: auto;
		}
		#node_select{
			width: fit;
		}
		@media screen and (max-width: 1000px) {
			.tabs_body{
				height: min-content !important;
				max-width: 100vw !important;
				font-size: var(--font_size_small) !important;
				&>.controls{
					gap: 0.5rem;
				}
			}
			.logo{
				width: 8rem !important;
			}
			/* #view{
				height: 100vh;
			} */
		}
    </style>
    <script>
        (function(){
			let status = null
			let selected_format = null;
			function add_tab(data){
				console.log("adding tab", data)
				let input = document.createElement("input")
				input.type = "button"
				input.value = data.title
				input.id = data.component
				input.classList.add("tab", "btn-secondary")
				input.onclick = () => {
					set_tab(input.id, data.id)
				}
				document.querySelector(".controls").appendChild(input)
								
			}
			function add_tabs(data, element){
				current_tab = {}
				idx = 1
				Object.keys(data).forEach((item, index) => {
					if (item.startsWith("tab_")) {
						console.log("item ", item)
						let meta = item.split("_")
						if (meta[1] != idx){
							idx = meta[1]
						}
						current_tab[meta[2]] = data[item]
						if (meta[2] == "id"){
							console.log("creating tab", current_tab)
							add_tab(current_tab)
							current_tab = {}
						}
					}
				})
			}
			async function set_tab(node, nid){
				let loadComponent, componentRegistry
				await import("./scripts/util.js").then((module) => {
					loadComponent = module.loadComponent;
					componentRegistry = module.componentRegistry
				});
				let view = document.querySelector("#view")
				view.innerHTML = "";	
				await loadComponent(node, view)
				data = {id: "view"}
				let component_data = JSON.parse(localStorage.getItem(nid)) || data
				// if (component_data == null){
				// 	return
				// }
				console.log("component data ", component_data)
				component_data.id = data.id
				console.log("component data ", component_data)
				componentRegistry.get(node)(component_data)
				selected_format = node
				// let close_btn = document.createElement("button")
				// close_btn.classList.add("btn-primary")
				// close_btn.innerHTML = "<span class=\"text\">x</span>"
				// close_btn.onclick = () => {
				// 	nodes.splice(nodes.indexOf(node), 1)
				// 	close_btn.parentElement.remove()
				// }
			}

			function select_random_tab(arr, element) {
				const getRandomItem = (arr) => arr[Math.floor(Math.random() * arr.length)];
				let tab = getRandomItem(arr);
				set_tab(tab)
				element.querySelectorAll(".add_node").forEach(b => {
					b.classList.remove("active")
					if (b.id == tab) {
						b.classList.add("active")
					}
				})
			}

            function init(data){
                const element = document.getElementById(`${data.id}`)
				element.querySelectorAll(".add_node").forEach(b => {
					b.onclick = () => {
						set_tab(b.id)
						b.classList.add("active")
					}
					b.onmouseout = () => {
						b.classList.remove("active")
					}
				})
				
				add_tabs(data)
				set_tab(data.default, data.default_id)
            }

            window.componentRegistry.register("tabs", init)
        })()
    </script>
</div>
