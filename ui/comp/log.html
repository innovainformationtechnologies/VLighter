<div class="log_container">
	<div class="controls">
		<button class="btn-primary" id="clear_cache">Clear Cache</button>
	</div>
    <div class="log_body">
		<div id="log" class="controls">
		<h2>System Logs</h2>
		<p class="text muted">See what's going on</p>
		<button class="btn-primary" id="clear_log">Clear Logs</button>
	</div>
	<p class="log_text"></p>
    </div>
    <style>
		.log_body{
			padding: 1rem;
		}
		#log{
			display: flex;
			flex-direction: row;
			justify-content: space-between;
			align-items: center;
			padding: 1rem;
		}
		#log_dropdown:hover{
			cursor: pointer;
		}
    </style>
    <script>
        (function(){
			async function get_log(element){
				await fetch("/log")
					.then(response => response.text())
					.then(text => {
						console.log(text)
						element.querySelector(".log_text").innerText = text

				}).catch(error => element.querySelector(".log_text").innerText = error)
			}
            function init(data){
                const element = document.getElementById(`${data.id}`)
				element.querySelector("#clear_log").addEventListener("click", async () => {
					await fetch("http://localhost:5500/message_bus",
						{
							method: "POST",
							headers: {
								"Content-Type": "application/json"
							},
							body: JSON.stringify({
								listener: "logger",
								event: "clear",
								data: ""
							})
						}
					)
					get_log(element)
				})
				setInterval(() => {
					get_log(element)
				}, 5000)
				get_log(element)
            }

            window.componentRegistry.register("log", init)
        })()
    </script>
</div>
